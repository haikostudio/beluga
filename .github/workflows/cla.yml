# Demande à l'auteur d'une pull request de signer CLA.md, une fois, par un commentaire.
# Les signatures vivent dans ce dépôt, sur la branche `cla-signatures`.
# haikostudio est le compte du titulaire des droits : il n'a rien à signer.
# Ne tourne que sur le dépôt PUBLIC : le dépôt de travail ne reçoit pas de pull request.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# Chaque passage écrit dans signatures/cla.json sur la même branche : deux passages en même temps
# se marchent dessus. Ils s'attendent donc, sans s'annuler.
concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.repository == 'haikostudio/beluga' && (github.event_name == 'pull_request_target' || github.event.issue.pull_request)
    steps:
      - name: Vérifier ou enregistrer la signature
        # Ne récupère JAMAIS le code de la pull request : il ne lit que les commentaires.
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/haikostudio/beluga/blob/main/CLA.md
          branch: cla-signatures
          allowlist: haikostudio,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Merci pour votre proposition ! Avant de pouvoir la reprendre, merci de lire
            l'[accord des contributeurs](https://github.com/haikostudio/beluga/blob/main/CLA.md)
            et de le signer en publiant le commentaire ci-dessous. Vous ne le faites qu'une fois.
            — Thank you! Before we can take your pull request, please read the
            [Contributor Licence Agreement](https://github.com/haikostudio/beluga/blob/main/CLA.md)
            and sign it by posting the comment below. You only do this once.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Tous les contributeurs ont signé l'accord. Merci ! — All contributors have signed the CLA. Thank you!
          lock-pullrequest-aftermerge: false
