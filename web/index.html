<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget : le clavier réduit la page au lieu de la faire glisser. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#212121" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- « black-translucent » (19/10/2026, choix de l'utilisateur, recette de
         ProjetE d207da4) : la page passe SOUS l'heure, fonds et volets montent
         jusqu'en haut de l'écran d'une seule teinte. iOS 26/27 y pose un flou
         (« scroll edge effect ») qu'aucune CSS n'éteint : le contenu démarre
         15 px sous l'encart (`--marge-flou-ios`, web/src/styles.css) pour rester
         hors de ce flou. « default » est ABANDONNÉ : bande grise opaque ou flou
         une image sur vingt sur iOS 27. iOS ne relit ce réglage qu'à l'ajout de
         l'icône : supprimer puis réinstaller l'application pour le voir. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beluga" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Beluga Build</title>
    <script>
      /*
       * LE THÈME SE DÉCIDE AVANT LE PREMIER AFFICHAGE, depuis un REPÈRE LOCAL —
       * jamais la source de vérité, qui reste le réglage enregistré côté serveur
       * (projet, réglage général, mode automatique ; `web/src/lib/theme.ts`). Ce repère
       * est écrit par `appliquerLeTheme` à chaque fois qu'un thème est VRAIMENT
       * posé, et ne sert qu'à deviner juste au tout premier instant : sans lui,
       * l'application flashait toujours en SOMBRE avant de rejoindre le vrai
       * thème, quel qu'il soit — un clignotement à CHAQUE chargement, sur CHAQUE
       * appareil, que l'on confondait avec « le thème change tout seul ». Le vrai
       * thème reprend la main dès que la connexion au serveur est prête, y
       * compris quand il diffère de ce repère (autre appareil, thème changé
       * entre-temps).
       *
       * La table ci-dessous est une COPIE du catalogue (`shared/src/themes.ts`) :
       * un script exécuté avant tout module ne peut rien importer sans perdre
       * l'effet recherché (bloquer le premier affichage). Elle donne pour chaque
       * palette sa CLARTÉ et son FOND DE PAGE, et `scripts/verif-theme-sans-geste.mjs`
       * refuse toute divergence avec le catalogue — une copie qui dérive
       * produirait exactement le symptôme qu'on cherche à supprimer : une page
       * immobile qui change de couleur au bout d'une seconde.
       *
       * LA COULEUR DU BANDEAU SUIT DÈS CE PREMIER INSTANT. Sans elle, la barre
       * d'état du téléphone restait NOIRE au-dessus d'une application beige
       * jusqu'à la réponse du serveur.
       */
      (function () {
        var PALETTES = {
          sombre: ['sombre', 'hsl(0 0% 13%)'],
          clair: ['clair', 'hsl(0 0% 100%)'],
        };
        /* LES NOMS D'AVANT LA REFONTE (dix palettes colorées, et les deux tout
           premiers noms) se lisent comme leur CLARTÉ — la même table que
           `ANCIENS_THEMES` du catalogue. Un navigateur qui garde « sable » en
           repère s'ouvre donc en clair, sans passer par le sombre. */
        var ANCIENS = {
          dark: 'sombre',
          light: 'clair',
          sable: 'clair',
          'sable-sombre': 'sombre',
          ardoise: 'sombre',
          'ardoise-clair': 'clair',
          givre: 'clair',
          'givre-sombre': 'sombre',
          sapin: 'sombre',
          'sapin-clair': 'clair',
          contraste: 'clair',
          'contraste-sombre': 'sombre',
        };
        var repere = null;
        try {
          repere = window.localStorage.getItem('beluga-theme-flash');
        } catch (erreur) {
          repere = null;
        }
        var theme = repere && PALETTES[repere] ? repere : (repere && ANCIENS[repere]) || 'sombre';
        var sombre = PALETTES[theme][0] === 'sombre';
        document.documentElement.classList.toggle('dark', sombre);
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = sombre ? 'dark' : 'light';
        /* LE BANDEAU EN HEXADÉCIMAL (comme `couleurDeBandeau`) et `color-scheme`
           AUSSI EN BALISE : en barre « black-translucent », c'est lui qui donne
           à l'heure sa couleur (sombre sur fond clair, claire sur fond sombre). */
        var enHex = function (couleur) {
          var m = /^hsla?\(\s*([\d.]+)(?:deg)?[\s,]+([\d.]+)%[\s,]+([\d.]+)%/i.exec(couleur);
          if (!m) return couleur;
          var h = Number(m[1]) % 360, s = Number(m[2]) / 100, l = Number(m[3]) / 100;
          var a = s * Math.min(l, 1 - l);
          var canal = function (n) {
            var k = (n + h / 30) % 12;
            var v = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
            return ('0' + Math.round(v * 255).toString(16)).slice(-2);
          };
          return '#' + canal(0) + canal(8) + canal(4);
        };
        var bandeau = document.querySelector('meta[name="theme-color"]');
        if (bandeau) bandeau.setAttribute('content', enHex(PALETTES[theme][1]));
        var schema = document.querySelector('meta[name="color-scheme"]');
        if (!schema) {
          schema = document.createElement('meta');
          schema.setAttribute('name', 'color-scheme');
          document.head.appendChild(schema);
        }
        schema.setAttribute('content', sombre ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <!-- CE QU'ON VOIT AVANT QUE LE PREMIER CODE ARRIVE : une pause qui tourne, dans
         les couleurs de la page. Sans elle, un téléphone restait sur une page
         vide pendant tout le téléchargement. React la remplace au premier rendu
         (`Demarrage`, web/src/main.tsx, prend le relais). -->
    <style>
      #demarrage { display: grid; place-items: center; height: 100%; }
      #demarrage span { width: 20px; height: 20px; border: 2px solid hsl(0 0% 55%); border-top-color: transparent; border-radius: 50%; animation: demarrage-tourne 0.9s linear infinite; }
      @keyframes demarrage-tourne { to { transform: rotate(360deg); } }
    </style>
    <div id="root"><div id="demarrage"><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
