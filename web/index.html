<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget : le clavier réduit la page au lieu de la faire glisser. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HaikoDev" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>HaikoDev</title>
    <script>
      // Le thème se décide AVANT le premier affichage : sinon l'application
      // clignote en blanc à chaque chargement (PLAN §30). Le sombre est le
      // défaut ; celui des QUATRE thèmes enregistré côté serveur s'applique dès
      // l'ouverture de la connexion, sans rien conserver dans le navigateur
      // (`web/src/lib/theme.ts`).
      document.documentElement.classList.add('dark');
      document.documentElement.dataset.theme = 'sombre';
      document.documentElement.style.colorScheme = 'dark';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
