<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget : le clavier réduit la page au lieu de la faire glisser. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HaikoDev" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>HaikoDev</title>
    <script>
      /*
       * LE THÈME SE DÉCIDE AVANT LE PREMIER AFFICHAGE, depuis un REPÈRE LOCAL —
       * jamais la source de vérité, qui reste le réglage enregistré côté serveur
       * (projet, réglage général, « Système » ; `web/src/lib/theme.ts`). Ce repère
       * est écrit par `appliquerLeTheme` à chaque fois qu'un thème est VRAIMENT
       * posé, et ne sert qu'à deviner juste au tout premier instant : sans lui,
       * l'application flashait toujours en SOMBRE avant de rejoindre le vrai
       * thème, quel qu'il soit — un clignotement à CHAQUE chargement, sur CHAQUE
       * appareil, que l'on confondait avec « le thème change tout seul ». Le vrai
       * thème reprend la main dès que la connexion au serveur est prête, y
       * compris quand il diffère de ce repère (autre appareil, thème changé
       * entre-temps).
       *
       * La table CLARTÉ est une COPIE, à la manière de `web/public/sw.js` : un
       * script exécuté avant tout module ne peut rien importer sans perdre
       * l'effet recherché (bloquer le premier affichage).
       */
      (function () {
        var CLARTE = {
          sombre: 'sombre',
          clair: 'clair',
          sable: 'clair',
          ardoise: 'sombre',
          givre: 'clair',
          sapin: 'sombre',
          contraste: 'clair',
        };
        var repere = null;
        try {
          repere = window.localStorage.getItem('haikodev-theme-flash');
        } catch (erreur) {
          repere = null;
        }
        var theme = repere && CLARTE[repere] ? repere : 'sombre';
        var sombre = CLARTE[theme] === 'sombre';
        document.documentElement.classList.toggle('dark', sombre);
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = sombre ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
